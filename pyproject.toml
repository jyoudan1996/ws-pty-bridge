[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-pty-bridge"
version = "0.1.0"
description = "Authenticated reverse WebSocket PTY for authorized server administration"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ws-pty-server = "ws_pty_bridge.server:main"
ws-pty-agent = "ws_pty_bridge.agent:main"
ws-pty-client = "ws_pty_bridge.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
